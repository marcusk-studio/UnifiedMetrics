apiVersion: v1
kind: Namespace
metadata:
  name: unifiedmetrics-trace-test
---
# Jaeger all-in-one with the OTLP receivers enabled.
# - 4317  OTLP gRPC
# - 4318  OTLP HTTP
# - 16686 Jaeger Query / UI / HTTP API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: unifiedmetrics-trace-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: query,     containerPort: 16686 }
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: unifiedmetrics-trace-test
spec:
  selector:
    app: jaeger
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: query,     port: 16686, targetPort: 16686 }
---
# The verifier job emits proxy + backend spans through the OTel driver against
# the Jaeger collector, then queries the Jaeger HTTP API to assert the trace
# shows up with the expected operations and services. The verifier image is
# loaded into the cluster from a local build (see test-k8s/run-trace-test.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: trace-verifier
  namespace: unifiedmetrics-trace-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: trace-verifier
    spec:
      restartPolicy: Never
      containers:
        - name: verifier
          image: unifiedmetrics-trace-verifier:dev
          imagePullPolicy: Never
          env:
            - name: OTLP_ENDPOINT
              value: "http://jaeger.unifiedmetrics-trace-test.svc.cluster.local:4317"
            - name: JAEGER_QUERY
              value: "http://jaeger.unifiedmetrics-trace-test.svc.cluster.local:16686"
